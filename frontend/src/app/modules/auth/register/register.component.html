<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-content>
      <h2>Register</h2>

      <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input matInput type="text" formControlName="fullName" placeholder="John Doe" />
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="registerForm.get('fullName')?.invalid">Full name is required (max 100 chars).</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="you@example.com" />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="registerForm.get('email')?.invalid">Valid email is required.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Min 8 characters" />
          <mat-icon matPrefix>lock</mat-icon>
          <mat-error *ngIf="registerForm.get('password')?.invalid">Password must be 8–100 characters.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Phone Number (optional)</mat-label>
          <input matInput type="text" formControlName="phoneNumber" placeholder="9876543210" />
          <mat-icon matPrefix>phone</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="TENANT">Tenant</mat-option>
            <mat-option value="PG_OWNER">PG Owner</mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width submit-btn" [disabled]="loading">
          {{ loading ? 'Creating account…' : 'Register' }}
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a routerLink="/login">Login</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
