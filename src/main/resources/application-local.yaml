# ============================================================
# StayMatch — Local Development Profile
# Activate: spring.profiles.active=local  (default)
# ============================================================

# ── H2 In-Memory Database ────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:staymatch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always

  # ── H2 Console ───────────────────────────────────────────────
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false

  # ── Cache (in-memory, no Redis required) ─────────────────────
  cache:
    type: simple

# ── CORS — allow Angular dev server ───────────────────────────
app:
  cors:
    allowed-origins: http://localhost:4200

# ── Verbose logging for development ──────────────────────────
logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.staymatch: DEBUG

